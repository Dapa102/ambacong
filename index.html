<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambacong</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Game Canvas akan di-inject ke sini oleh Three.js -->
    </div>

    <!-- UI Overlay Base -->
    <div id="ui-layer" style="display: none">
      <div id="crosshair"></div>

      <!-- HUD Utama -->
      <div id="hud-container">
        <div id="health-bar-container">
          <div id="health-bar" style="width: 100%"></div>
        </div>
        <div id="stamina-bar-container">
          <div id="stamina-bar" style="width: 100%"></div>
        </div>
        <div id="flashlight-indicator">🔋 100%</div>
      </div>

      <div id="interaction-prompt" style="display: none">Tekan E untuk...</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
