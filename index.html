<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambacong</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="ui-layer">
      <div id="crosshair"></div>
      <p id="objective" role="status">Cari kunci.</p>
      <p id="interaction-prompt"></p>
      <p id="flashlight-status" role="status">Senter: Nyala 100%</p>
      <p id="stamina-status">Stamina: 100%</p>
      <div id="instructions">
        <h1 id="screen-title">Ambacong</h1>
        <p id="screen-help">
          WASD bergerak, Shift lari, mouse melihat, E interaksi, F senter, Esc berhenti.
        </p>
        <button id="start-button" type="button">Mulai</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
